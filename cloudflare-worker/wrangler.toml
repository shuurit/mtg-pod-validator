name = "mtg-pod-validator-relay"
main = "relay.js"
compatibility_date = "2026-01-01"
account_id = "8ca62cd3d17495e04f67d67caa28e0a8"

[[kv_namespaces]]
binding = "DECK_CACHE"
id = "77b23dc700d94ad59b05dbc2712dfe63"

[[d1_databases]]
binding = "DB"
database_name = "mtg-pod-validator-db"
database_id = "033e3773-25f9-4f6a-ba86-9cb8bbcc5b8e"

# Workers AI -- Build a Deck's "What are you looking for?" picks from the
# player's own collection (handleDeckBuilderCollectionPicks in relay.js).
[ai]
binding = "AI"

# The Decks tab's stored deck copies: refresh_deck_snapshots (scheduled in
# relay.js) re-reads the few oldest each hour, so a deck rarely opens from a
# copy more than a day old even if nobody's looked at it.
[triggers]
crons = ["23 * * * *"]
