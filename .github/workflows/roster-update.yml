name: Apply Roster Update

on:
  repository_dispatch:
    types: [roster-update]

permissions:
  contents: write

jobs:
  roster-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          pip install openpyxl

      - name: Apply roster update and recalculate
        env:
          ROSTER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python scripts/apply_roster_update.py

      - name: Check whether relay.js changed
        id: relay-diff
        run: |
          if git diff --quiet cloudflare-worker/relay.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deck-strength.xlsx cloudflare-worker/relay.js
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Apply roster update via the app (automated)"
          git push

      - name: Redeploy Worker (only if relay.js changed -- a new player was added)
        if: steps.relay-diff.outputs.changed == 'true'
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
