name: Post Discord Live Report

on:
  repository_dispatch:
    types: [post-discord]

permissions:
  contents: write

jobs:
  post-discord-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.SEASON_STAT_WEBHOOK }}
        run: python scripts/post_to_discord.py

      - name: Commit Discord post tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discord_last_post.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Track latest Discord post for this game (automated)"
          git push

      - name: Archive to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.SEASON_ARCHIVE_WEBHOOK }}
        run: python scripts/post_to_discord_archive.py
