name: Post Discord Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-discord-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl matplotlib requests

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.SEASON_STAT_WEBHOOK }}
        run: python scripts/post_to_discord.py

      - name: Commit Discord post tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discord_last_post.json discord_rankings_snapshot.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Track latest Discord post (manual re-post)"
          git push
