name: Add Game to Log

on:
  repository_dispatch:
    types: [add-game]

permissions:
  contents: write

jobs:
  add-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          pip install openpyxl

      - name: Add game and recalculate
        env:
          GAME_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python scripts/add_game.py

      - name: Refresh Player Win Rates
        run: python scripts/regen_winrates.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deck-strength.xlsx player-win-rates.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add game via Games to Update tab (automated)"
          git push
